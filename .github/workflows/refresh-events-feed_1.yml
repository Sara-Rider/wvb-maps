# Rebuild events.geojson and the per-event nearby feeds
#
# WHY THIS FILE EXISTS
# --------------------
# scripts/build_events_feed.py has been in the repo building events.geojson
# from the live Webflow Events collection, and nothing has ever run it. There
# was no workflow for it — five workflows existed and none called that script.
# So events.geojson only changed when somebody ran the script by hand, which
# in practice meant it did not change.
#
# That is not a cosmetic gap. events.geojson is read by:
#   * the events index map            (pin positions)
#   * event-nearby-events-v1          (both related-events strips)
#   * past-event-label-v2             (end dates, so a 3-day festival is not
#                                      marked "past" on its middle day)
#
# On 2026-09-01 Honor Flight's coordinate was corrected in Airtable AND in
# Webflow, both published, and the live site still pinned it to the middle of
# the state — because the feed had not been rebuilt since 2026-08-19. Nothing
# reported an error. Nothing was broken. It was just old, silently.
#
# WHY THE TWO SCRIPTS RUN TOGETHER
# --------------------------------
# The nearby feeds describe the businesses around each event, so an event whose
# coordinate just changed needs both rebuilt or the map and the rail disagree.
# Running them as one job means there is one thing to schedule and one thing to
# remember, which for a solo operator is the whole point.
#
# build-event-nearby.yml is left in place and untouched — it is still the way
# to rebuild just the nearby feeds without touching events.geojson.
#
# SCHEDULE
# --------
# Every two hours. Events reach Webflow through Make within about 15 minutes of
# Approve, so the worst case is a new event that is live on the site but absent
# from the map for under two hours. Tighten the cron if that ever feels long;
# the commit step is a no-op when nothing changed, so a more frequent run costs
# nothing but a few seconds of runner time.

name: Refresh events feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write        # lets the built-in token commit the rebuilt files

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build events.geojson
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: python scripts/build_events_feed.py

      # Fail loudly rather than committing an empty or truncated feed over a
      # good one. A feed with no features is always a bug — the site has
      # published events — and silently replacing a working file with an empty
      # one is the failure mode this whole workflow exists to prevent.
      - name: Sanity-check the feed
        run: |
          python - <<'PY'
          import json, sys
          fc = json.load(open('events.geojson'))
          n = len(fc.get('features', []))
          print(f'events.geojson has {n} features')
          if n == 0:
              sys.exit('REFUSING TO COMMIT: events.geojson built with zero features')
          PY

      - name: Build per-event nearby feeds
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: python scripts/build_event_nearby.py

      - name: Commit the feeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.geojson events/
          if git diff --staged --quiet; then
            echo "No change — feeds already current."
          else
            git commit -m "Rebuild events.geojson and nearby feeds"
            git push
          fi
