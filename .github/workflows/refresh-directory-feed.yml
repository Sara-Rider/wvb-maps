# Repo path: .github/workflows/refresh-directory-feed.yml
# Rebuilds directory.geojson from the LIVE Webflow directory, commits it, and
# purges the jsDelivr CDN cache (Decision 41). GitHub is the source of truth;
# the map reads the CDN mirror.
#
# Runs manually now (Actions tab -> Run workflow) so you can test it today.
# The SCHEDULE stays OFF until launch: uncomment the two lines under `schedule`
# and set the cron when you know your cadence.

name: Refresh directory proximity feed

on:
  workflow_dispatch: {}          # manual run — test now, and run on demand anytime
  # ---- LAUNCH: uncomment and pick ONE cron to turn on the schedule ----
  # schedule:
  #   - cron: '0 8 * * 1'        # weekly     — Mondays 08:00 UTC
  #   - cron: '0 8 1,15 * *'     # bi-weekly  — 1st & 15th, 08:00 UTC
  #   - cron: '0 8 1 * *'        # monthly    — 1st of month, 08:00 UTC

permissions:
  contents: write                # lets the built-in token commit the rebuilt file

concurrency:                     # never let two runs push at once
  group: refresh-directory-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Rebuild directory.geojson from live Webflow directory
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: python scripts/build_directory_feed.py

      - name: Commit only if the feed changed
        run: |
          git config user.name  "wvb-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory.geojson
          if git diff --staged --quiet; then
            echo "No changes — feed already current."
          else
            git commit -m "Auto-refresh directory.geojson"
            git push
            echo "PURGE=1" >> "$GITHUB_ENV"
          fi

      - name: Purge jsDelivr cache (only if the file changed)
        if: env.PURGE == '1'
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/Sara-Rider/wvb-maps@main/directory.geojson"
          echo "Requested jsDelivr purge."
