name: Render directory card art

# Draws the E3 directory card (generated ridge landscape, travel region over
# county) for every listing that needs one, commits the PNGs to /renders,
# points each live Webflow item's featured-image at its new card, and stamps
# Map Rendered in Airtable for the listings that landed.
#
# Replaced the pin-map thumbnail render on 2026-10-19.
# Spec: WVB_DirectoryCardArt_Spec.md (WVB Business Brain project).
#
# THE QUEUE COMES FROM AIRTABLE: view "5 · Render census" on the live base,
# narrowed to rows whose Needs Render is set. Three ways to run it:
#   - normal:      leave everything blank — renders what Needs Render asks for
#   - one record:  put an Airtable record ID in record_ids — the proof run
#   - everything:  tick render_all — the one-time switch from the old map tiles
#
# THE TRIGGER STAYS MANUAL. Run it when you mean to.
#
# Secrets: AIRTABLE_TOKEN (read + write on the live WVB Operations base),
#          WEBFLOW_API_TOKEN (CMS read + write).

on:
  workflow_dispatch:
    inputs:
      record_ids:
        description: "Only these Airtable record IDs (comma-separated). Blank = use Needs Render."
        required: false
        default: ""
      render_all:
        description: "Re-render every Verified/Published listing with a pin, ignoring Needs Render"
        required: false
        default: false
        type: boolean
      write_webflow:
        description: "Point each listing's Webflow featured-image at its new card"
        required: false
        default: true
        type: boolean
      stamp:
        description: "Stamp Map Rendered in Airtable for listings whose card landed"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Read the queue and print what WOULD render. Nothing drawn, written or stamped."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: directory-card-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies (Puppeteer + Chromium, Raleway)
        working-directory: tools/render-map
        run: npm ci

      - name: Render cards
        working-directory: tools/render-map
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          RECORD_IDS: ${{ github.event.inputs.record_ids }}
          RENDER_ALL: ${{ github.event.inputs.render_all == 'true' && '1' || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node render-batch.mjs

      - name: Commit cards
        id: commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "wvb-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add renders/
          git commit -m "Render directory card art" || echo "No changes to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Runs only after the push: the URL it hands Webflow is pinned to that commit.
      - name: Write cards to Webflow
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.write_webflow != 'false' }}
        working-directory: tools/render-map
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: node webflow-write.mjs

      # Runs last. With write_webflow off, only listings not yet on the site are
      # safe to stamp, so the stamp step is skipped entirely rather than guessing.
      - name: Stamp Map Rendered in Airtable
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.stamp != 'false' && github.event.inputs.write_webflow != 'false' }}
        working-directory: tools/render-map
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node stamp-rendered.mjs
