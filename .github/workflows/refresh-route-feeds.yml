#Repo path: .github/workflows/refresh-route-feeds.yml
#
# Generates routes/<slug>.geojson for EVERY published route, from:
#   tracks/<slug>.geojson   authored road geometry (Furkot export, hand-committed)
#   The Stops               the route's ordered reference to Directory listings
#
# This is not an optimisation — it IS the build step. Running it is how the
# route feeds come into existence. Manual only for now; nothing here is on a
# schedule, and the repository_dispatch hook is available if a scenario ever
# wants to fire it.
#
# A route with no tracks/<slug>.geojson still gets a feed, carrying its stops
# with no line. A route with neither gets an empty feed, and the embed hides
# the map rather than drawing another route's.

name: Rebuild route map feeds

on:
  workflow_dispatch: {}

  repository_dispatch:
    types: [routes-changed]

permissions:
  contents: write

concurrency:
  group: refresh-route-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Rebuild every route feed from live Webflow Routes
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          set -o pipefail
          python scripts/build_route_feed.py 2>&1 | tee build.log

      # `tee -a`, not `tee`. The step above CREATES build.log; a plain tee here
      # would truncate it and throw away the feed report along with any FAIL it
      # already recorded. Appending also means the existing FAIL gate at the
      # bottom of this file covers this script for free — no second gate to
      # write, and no second gate to forget.
      - name: Keep every listing-url pointing at its own listing
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          set -o pipefail
          python scripts/sync_listing_urls.py 2>&1 | tee -a build.log

      - name: Commit only if a feed changed
        run: |
          git config user.name  "wvb-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes routes-index.geojson
          if git diff --staged --quiet; then
            echo "No changes — route feeds already current."
          else
            git commit -m "Auto-refresh route map feeds"
            git push
            echo "PURGE=1" >> "$GITHUB_ENV"
          fi

      # jsDelivr purges a whole directory with /gh/user/repo@main/dir/ — one
      # call covers every route feed, however many there are.
      - name: Purge jsDelivr cache (only if something changed)
        if: env.PURGE == '1'
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/Sara-Rider/wvb-maps@main/routes/"
          curl -sS "https://purge.jsdelivr.net/gh/Sara-Rider/wvb-maps@main/routes-index.geojson"
          echo "Requested jsDelivr purge for routes/ and routes-index.geojson."
      - name: Fail the run if the builder reported a hard finding
        if: always()
        run: |
          if [ -f build.log ] && grep -q "FAIL" build.log; then
            echo "::error::build_route_feeds.py reported a hard finding — a stop"
            echo "::error::with no coordinate, an unpublished stop, or a bad token."
            grep "FAIL" build.log
            exit 1
          fi
          echo "No hard findings."
      - name: Purge jsDelivr cache
        run: curl -sS https://purge.jsdelivr.net/gh/Sara-Rider/wvb-maps@main/routes-index.geojson
