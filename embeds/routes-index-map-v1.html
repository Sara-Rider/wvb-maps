<!-- WEST VIRGINIA BIKERS — All-Routes Map · v1 · 2026-08-20
     Lives on the /routes INDEX page, above the route cards.

     Third of the three index maps, and it follows the same rule the Directory
     and Events maps follow: THE MAP IS A PROJECTION OF THE VISIBLE CARDS. It
     runs no filter logic of its own. Whatever the Webflow filters leave on the
     page is what the map draws. That is what keeps the map and the list from
     ever disagreeing — there is only one filter, and Webflow owns it.

     HOW A CARD IS MATCHED TO A ROUTE
     --------------------------------
     Not by class name. Class names are renameable in the Designer and this
     embed cannot see the rename, which is exactly how the Directory map broke.
     It keys on the one thing that must be true of a route card: it links to
     its route. Any anchor whose href ends in a slug the feed knows identifies
     a card, and the card is that anchor's enclosing `.w-dyn-item` — a Webflow
     structural class, not an authored one.

     If no cards are found at all, the map draws every route in the feed rather
     than nothing. A discovery map that renders empty because a class changed
     is worse than one that briefly ignores a filter.

     COLOUR
     ------
     Every route line is Mountain Slate. Route Gold paints exactly one line:
     the one you are pointing at. Six gold lines would be six things shouting;
     gold has to mean "this one" here, the same way it means "the road you are
     reading about" on a route page. -->

<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<style>
  .wvb-rmap{
    --slate:#3D5A6B; --gold:#C8922A; --gold-hover:#A8791F;
    --green:#2D5016; --asphalt:#1A1A1A; --mist:#F2F0EB;
    font-family:'Raleway',system-ui,sans-serif; color:var(--asphalt);
    margin:0 0 28px;
  }
  .wvb-rmap__frame{
    position:relative; width:100%; height:520px;
    border-radius:10px; overflow:hidden; background:var(--mist);
  }
  .wvb-rmap__canvas{ width:100%; height:100%; }
  .wvb-rmap__count{
    position:absolute; left:12px; bottom:12px; z-index:2;
    background:rgba(255,255,255,.94); border:1px solid #e2ddd2; border-radius:8px;
    padding:7px 12px; font-size:12px; font-weight:700; letter-spacing:.03em;
    text-transform:uppercase; color:var(--slate); pointer-events:none;
  }
  .wvb-rmap__empty{
    position:absolute; inset:0; z-index:3; display:none;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(242,240,235,.92); padding:24px;
    font-size:14px; line-height:1.5; color:#6b665d;
  }
  .wvb-rmap__empty.is-on{ display:flex; }

  .wvb-rpop{ font-family:'Raleway',system-ui,sans-serif; max-width:230px; }
  .wvb-rpop__name{ font-family:'Cinzel',serif; font-weight:600; font-size:15px; color:var(--slate); }
  .wvb-rpop__meta{ font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:#7a746a; margin:3px 0 7px; }
  .wvb-rpop__desc{ font-size:13px; line-height:1.4; margin-bottom:8px; }
  .wvb-rpop a{ color:var(--gold-hover); font-weight:700; font-size:13px; text-decoration:none; }
  .wvb-rpop a:hover{ text-decoration:underline; }
  .wvb-rmap .maplibregl-popup-content{ border-radius:10px; padding:12px 14px; }

  @media (max-width:820px){
    .wvb-rmap__frame{ height:380px; }
  }
</style>

<div class="wvb-rmap">
  <div class="wvb-rmap__frame">
    <div id="wvb-rmap-canvas" class="wvb-rmap__canvas"></div>
    <div class="wvb-rmap__count" id="wvb-rmap-count"></div>
    <div class="wvb-rmap__empty" id="wvb-rmap-empty">
      No routes match these filters yet. Clear one to bring the map back.
    </div>
  </div>
</div>

<script>
(function () {
  const CFG = {
    FEED_URL:     'https://cdn.jsdelivr.net/gh/Sara-Rider/wvb-maps@main/routes-index.geojson',
    FEED_URL_RAW: 'https://raw.githubusercontent.com/Sara-Rider/wvb-maps/main/routes-index.geojson',
    CENTER: [-80.60, 38.75], ZOOM: 6.6,
    STYLE: 'https://tiles.openfreemap.org/styles/liberty'
  };
  const BRAND = { slate:'#3D5A6B', gold:'#C8922A', asphalt:'#1A1A1A', mist:'#F2F0EB' };

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const canvasEl = document.getElementById('wvb-rmap-canvas');
  const countEl  = document.getElementById('wvb-rmap-count');
  const emptyEl  = document.getElementById('wvb-rmap-empty');

  const map = new maplibregl.Map({
    container: canvasEl, style: CFG.STYLE,
    center: CFG.CENTER, zoom: CFG.ZOOM,
    cooperativeGestures: true
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'top-right');
  const popup = new maplibregl.Popup({ closeButton:true, closeOnClick:true, offset:10 });

  let lines = [], starts = [], bySlug = {};
  let cards = [];            // [{slug, el}]
  let activeSlug = null;

  function slugFromHref(href) {
    try {
      var path = new URL(href, location.origin).pathname;
      var parts = path.replace(/\/+$/, '').split('/');
      if (parts.length < 3 || parts[parts.length - 2] !== 'routes') return null;
      return parts[parts.length - 1] || null;
    } catch (e) { return null; }
  }

  /* Find the cards. Keyed on the route link, never on a class name — the
     Directory map broke once because a card's only anchor was a bare href
     with no slug in it, and the lesson was to verify against the DOM rather
     than assume the markup. `.w-dyn-item` is Webflow's own structural class
     on a Collection List item, so it survives any renaming the founder does
     to her own classes. */
  function findCards() {
    var seen = {}, out = [];
    document.querySelectorAll('a[href]').forEach(function (a) {
      var slug = slugFromHref(a.getAttribute('href'));
      if (!slug || !bySlug[slug] || seen[slug]) return;
      var item = a.closest('.w-dyn-item') || a.closest('[role="listitem"]');
      if (!item || item.contains(canvasEl)) return;   // never match our own frame
      seen[slug] = 1;
      out.push({ slug: slug, el: item });
    });
    return out;
  }

  function isVisible(el) {
    if (!el) return false;
    if (el.offsetParent === null && getComputedStyle(el).position !== 'fixed') return false;
    var s = getComputedStyle(el);
    return s.display !== 'none' && s.visibility !== 'hidden';
  }

  function visibleSlugs() {
    if (!cards.length) return Object.keys(bySlug);   // no cards found: draw everything
    var live = cards.filter(c => isVisible(c.el)).map(c => c.slug);
    return live;
  }

  function render() {
    var live = visibleSlugs();
    var set = {};
    live.forEach(s => { set[s] = 1; });

    var shownLines  = lines.filter(f => set[f.properties.slug]);
    var shownStarts = starts.filter(f => set[f.properties.slug]);

    map.getSource('routes').setData({ type:'FeatureCollection', features: shownLines });
    map.getSource('route-starts').setData({ type:'FeatureCollection', features: shownStarts });

    var total = shownLines.reduce((n, f) => n + (Number(f.properties.miles) || 0), 0);
    countEl.textContent = shownLines.length
      ? shownLines.length + (shownLines.length === 1 ? ' route' : ' routes')
        + (total ? ' · ' + total.toLocaleString() + ' miles' : '')
      : '';
    emptyEl.classList.toggle('is-on', shownLines.length === 0);

    if (shownLines.length) {
      var b = new maplibregl.LngLatBounds();
      var walk = (arr) => arr.forEach(c => Array.isArray(c[0]) ? walk(c) : b.extend(c));
      shownLines.forEach(f => walk(f.geometry.coordinates));
      if (!b.isEmpty()) map.fitBounds(b, { padding:50, maxZoom:11, duration:400 });
    }
  }

  function setActive(slug) {
    if (activeSlug === slug) return;
    activeSlug = slug;
    if (map.getLayer('route-line')) {
      map.setPaintProperty('route-line', 'line-color',
        slug ? ['case', ['==', ['get','slug'], slug], BRAND.gold, BRAND.slate] : BRAND.slate);
      map.setPaintProperty('route-line', 'line-width',
        slug ? ['case', ['==', ['get','slug'], slug], 5, 3] : 3);
    }
    cards.forEach(c => c.el.classList.toggle('is-map-active', c.slug === slug));
  }

  function popupHTML(p) {
    var meta = [p.miles ? p.miles + ' miles' : '', p.rideTime, p.difficulty, p.region]
      .filter(Boolean).join(' · ');
    return '<div class="wvb-rpop">'
      + '<div class="wvb-rpop__name">' + esc(p.name) + '</div>'
      + (meta ? '<div class="wvb-rpop__meta">' + esc(meta) + '</div>' : '')
      + (p.short ? '<div class="wvb-rpop__desc">' + esc(p.short) + '</div>' : '')
      + '<a href="' + esc(p.url) + '">Ride this route &rarr;</a>'
      + '</div>';
  }

  map.on('load', async function () {
    /* v1.1 — a CDN that HANGS is a different failure from a CDN that 404s,
       and only the second one was handled. jsDelivr packs the repo on a cold
       cache after a fresh commit, which is exactly the minute someone reloads
       the page. A request that never settles left the map initialised, the
       count blank, the empty state off and NOTHING in the console — the worst
       kind of failure, because it looks like nothing happened. The timeout
       turns a hang into a rejection so the raw fallback actually gets a turn. */
    const FETCH_TIMEOUT_MS = 4000;
    const fetchJSON = async (url) => {
      const ctl = new AbortController();
      const timer = setTimeout(function () { ctl.abort(); }, FETCH_TIMEOUT_MS);
      try { const r = await fetch(url, { cache:'no-store', signal: ctl.signal }); return await r.json(); }
      catch (e) { console.warn('WVB routes map: failed to load', url, e); return null; }
      finally { clearTimeout(timer); }
    };
    // Raw fallback: jsDelivr 404s or stalls on a cold cache for the first
    // minute or so after a fresh commit, which is exactly when someone checks.
    let feed = await fetchJSON(CFG.FEED_URL);
    if (!feed || !feed.features) {
      console.warn('WVB routes map: jsDelivr feed unavailable; falling back to raw.');
      feed = await fetchJSON(CFG.FEED_URL_RAW);
    }
    if (!feed || !feed.features || !feed.features.length) {
      // The index feed carries PUBLISHED routes only. An empty feed means
      // every route is still a draft — hide the map rather than show an empty
      // state that reads like a filter problem.
      console.warn('WVB routes map: routes-index.geojson is empty or missing. '
        + 'It carries published routes only — publish a route, then run the '
        + 'Rebuild route map feeds Action.');
      var shell = document.querySelector('.wvb-rmap');
      if (shell) shell.style.display = 'none';
      return;
    }

    lines  = feed.features.filter(f => f.properties && f.properties.kind === 'route');
    starts = feed.features.filter(f => f.properties && f.properties.kind === 'route-start');
    lines.forEach(f => { bySlug[f.properties.slug] = f.properties; });

    map.addSource('routes', { type:'geojson', data:{ type:'FeatureCollection', features: [] } });
    map.addSource('route-starts', { type:'geojson', data:{ type:'FeatureCollection', features: [] } });

    map.addLayer({ id:'route-casing', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':BRAND.asphalt, 'line-width':6, 'line-opacity':0.28 } });
    map.addLayer({ id:'route-line', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':BRAND.slate, 'line-width':3 } });
    // A fat invisible line so a 3px route is actually clickable on a phone.
    map.addLayer({ id:'route-hit', type:'line', source:'routes',
      layout:{ 'line-join':'round','line-cap':'round' },
      paint:{ 'line-color':BRAND.slate, 'line-width':18, 'line-opacity':0 } });

    map.addLayer({ id:'route-start-dot', type:'circle', source:'route-starts',
      paint:{ 'circle-radius':5, 'circle-color':BRAND.mist,
              'circle-stroke-width':3, 'circle-stroke-color':BRAND.slate } });
    map.addLayer({ id:'route-label', type:'symbol', source:'route-starts',
      layout:{ 'text-field':['get','name'], 'text-size':12,
               'text-offset':[0, 1.2], 'text-anchor':'top',
               // A font stack, not one font: MapLibre asks the style's glyph
               // server for each in turn. If OpenFreeMap ever swaps its font
               // set the labels degrade to a different face rather than
               // vanishing with a console error.
               'text-font':['Noto Sans Regular','Open Sans Regular','Arial Unicode MS Regular'],
               'text-allow-overlap':false },
      paint:{ 'text-color':BRAND.asphalt, 'text-halo-color':BRAND.mist,
              'text-halo-width':1.6 } });

    cards = findCards();
    if (!cards.length) {
      console.info('WVB routes map: no route cards found on this page — drawing '
        + 'every published route. If a Collection List is present, its links '
        + 'are not /routes/<slug>.');
    }

    render();

    /* Watch the cards, not the filter widget. Whatever hides a card — Webflow's
       own filter, a Finsweet attribute, pagination — shows up as a style or
       class change on the item, and this is the one place that is true for all
       of them. Same design as the Events map. */
    var pending = null;
    function schedule() {
      if (pending) return;
      pending = requestAnimationFrame(function () { pending = null; render(); });
    }
    var obs = new MutationObserver(schedule);
    cards.forEach(function (c) {
      obs.observe(c.el, { attributes:true, attributeFilter:['style','class','hidden'] });
      c.el.addEventListener('mouseenter', function () { setActive(c.slug); });
      c.el.addEventListener('mouseleave', function () { setActive(null); });
    });
    // A Collection List can also be re-rendered wholesale by a filter script,
    // which replaces the items instead of hiding them. Re-find in that case.
    var listRoot = cards.length ? cards[0].el.parentElement : null;
    if (listRoot) {
      new MutationObserver(function () {
        cards = findCards();
        cards.forEach(function (c) {
          obs.observe(c.el, { attributes:true, attributeFilter:['style','class','hidden'] });
        });
        schedule();
      }).observe(listRoot, { childList:true });
    }

    map.on('mousemove', 'route-hit', function (e) {
      map.getCanvas().style.cursor = 'pointer';
      setActive(e.features[0].properties.slug);
    });
    map.on('mouseleave', 'route-hit', function () {
      map.getCanvas().style.cursor = '';
      setActive(null);
    });
    map.on('click', 'route-hit', function (e) {
      var p = bySlug[e.features[0].properties.slug];
      if (p) popup.setLngLat(e.lngLat).setHTML(popupHTML(p)).addTo(map);
    });
    map.on('click', 'route-start-dot', function (e) {
      var p = bySlug[e.features[0].properties.slug];
      if (p) popup.setLngLat(e.features[0].geometry.coordinates.slice())
                  .setHTML(popupHTML(p)).addTo(map);
    });
  });
})();
</script>
